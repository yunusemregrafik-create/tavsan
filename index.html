 · Devam Ediyor · Beklemede',pending.map(item).join(''))}${box('Tamamlananlar',task.filter(r=>r.status==='Tamamlandı').map(item).join(''))}`;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return dateStr(d)});$('calendar').innerHTML=`<h1>Takvimim</h1><p class="muted">Haftalık ajanda · Kendi kayıtların (Google Takvim bağlantısı sonraki aşamada)</p>${dates.map(d=>box(new Date(d+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}),records.filter(r=>r.due===d).map(item).join(''))).join('')}`;let done=task.filter(r=>r.status==='Tamamlandı');$('reports').innerHTML=`<h1>Performans Merkezim</h1><div class="row"><button class="small" onclick="reportPeriod='day';render()">Günlük</button><button class="small" onclick="reportPeriod='week';render()">Haftalık</button><button class="small" onclick="reportPeriod='month';render()">Aylık</button></div>${performancePanel(task,reportPeriod)}${box('Çalışma sürelerini kaydet',`<p class="muted">Bir görev açıp “Çalışma süresi” alanına dakika ekleyebilirsin. Kronometre henüz eklenmedi.</p><button class="small" onclick="exportData()">Yedek indir</button>`)}`;$('settings').innerHTML=`<h1>Ayarlar</h1>${box('🎨 Görünüm',`<label>Tema</label><select id="themeSelect" onchange="prefs.theme=this.value;savePrefs();render()"><option value="soft">Tatlı / Soft</option><option value="sade">Sade Lite</option><option value="zarif">Zarif</option><option value="gece">Gece</option></select><p class="muted">Temalar yalnızca hafif renk değişiklikleri kullanır.</p>`)}${box('🔔 Bildirim tercihleri (taslak)',`<label>Sabah özeti saati</label><input id="morningInput" type="time" value="${esc(prefs.morning)}" onchange="prefs.morning=this.value;savePrefs()"><p><label><input id="weekendInput" type="checkbox" style="width:auto" ${prefs.weekend?'checked':''} onchange="prefs.weekend=this.checked;savePrefs()"> Hafta sonu da özet gönder</label></p><p class="muted">Bu ekran tercihleri saklar; ger function organizePreview(){let raw=$('content').value.trim();if(!raw){alert('Önce metin yaz.');return}let groups={Görevler:[],Kararlar:[],Toplantılar:[],Planlar:[],Notlar:[]};raw.split(/\n+|(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ])/).map(x=>x.trim()).filter(Boolean).forEach(x=>{let z=x.toLocaleLowerCase('tr');let key=/görev|yapılacak|hazırla|kontrol et|gönder|tamamla|sorumlu/.test(z)?'Görevler':/karar|kararlaştır|onaylandı/.test(z)?'Kararlar':/toplantı|görüşme/.test(z)?'Toplantılar':/bugün|yarın|haftaya|pazartesi|salı|çarşamba|perşembe|cuma/.test(z)?'Planlar':'Notlar';groups[key].push(x)});let out=Object.entries(groups).filter(([k,v])=>v.length).map(([k,v])=>k+'\n'+v.map(x=>'• '+x).join('\n')).join('\n\n');$('organizeResult').classList.remove('hide');$('organizeResult').textContent=out+'\n\nBu yalnızca anahtar kelime temelli önizlemedir. Kaydetmeden önce kontrol et.';let btn=document.createElement('button');btn.type='button';btn.className='primary';btn.style.marginTop='12px';btn.textContent='Bu düzeni notuma uygula';btn.onclick=()=>{$('content').value=out.split('\n\nBu yalnızca')[0];$('organizeResult').classList.add('hide')};$('organizeResult').appendChild(btn)}

window.addEventListener('beforeinstallprompt', event => {event.preventDefault();deferredInstallPrompt=event;document.getElementById('installApp').style.display='inline-block';});
document.getElementById('installApp').addEventListener('click',async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installApp').style.display='none';}else{alert('Chrome menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullan.');}});
window.addEventListener('appinstalled',()=>document.getElementById('installApp').style.display='none');
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}
</script><script type="module">
// Firebase yapılandırması: istemci uygulamasının herkese açık kimliği; gizli sunucu anahtarı değildir.
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, browserLocalPersistence, setPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyD7t5srWWMQHFFA1cDBvLEAQoijLfGQ_lc',authDomain:'tavsan-44365.firebaseapp.com',projectId:'tavsan-44365',storageBucket:'tavsan-44365.firebasestorage.app',messagingSenderId:'112751591946',appId:'1:112751591946:web:c41c85452fc8bf355055f3'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const label=document.getElementById('cloudState'),login=document.getElementById('cloudLogin');
let cloudUser=null,ready=false,unsubscribe=null,writing=false,pendingWrite=null,remoteSnapshotHash='',lastLocalHash='';
const hash=v=>JSON.stringify(v);
const status=t=>{label.textContent=t;label.title=t};
const copyLocal=()=>{try{localStorage.setItem('tavsan-koruma-'+new Date().toISOString().slice(0,10),JSON.stringify({records,prefs,created:new Date().toISOString()}))}catch(e){console.warn('Yerel koruma kopyası oluşturulamadı',e)}};
const merge=(a,b)=>{const m=new Map();for(const r of [...a,...b]){if(!r||!r.id)continue;const prev=m.get(r.id);if(!prev||String(r.updated||r.created||'')>=String(prev.updated||prev.created||''))m.set(r.id,r)}return [...m.values()].sort((x,y)=>String(y.created||'').localeCompare(String(x.created||'')))};
const ref=()=>doc(db,'users',cloudUser.uid,'data','main');
const persistLocal=()=>{localStorage.setItem('tavsan-v1',JSON.stringify(records));localStorage.setItem('tavsan-settings-v1',JSON.stringify(prefs));};
async function writeCloud(){if(!cloudUser||!ready)return;const payload={records,prefs};const serialized=hash(payload);if(serialized===remoteSnapshotHash){status('Bulutla eşitlendi');return}try{writing=true;status('Buluta kaydediliyor…');await setDoc(ref(),{...payload,updatedAt:serverTimestamp()});remoteSnapshotHash=serialized;status('Bulutla eşitlendi')}catch(err){status('Eşitleme başarısız · yerelde kayıtlı');console.error(err)}finally{writing=false;if(pendingWrite){clearTimeout(pendingWrite);pendingWrite=null}}}
function scheduleWrite(){if(!ready||!cloudUser)return;clearTimeout(pendingWrite);pendingWrite=setTimeout(writeCloud,850)}
// Mevcut kaydetme işlevini bozmadan bulut eşitlemesini ekle.
const originalSave=window.save;window.save=function(){originalSave();scheduleWrite()};
const originalSavePrefs=window.savePrefs;window.savePrefs=function(){originalSavePrefs();scheduleWrite()};
async function beginSync(user){ready=false;cloudUser=user;status('Bulut kontrol ediliyor…');if(unsubscribe){unsubscribe();unsubscribe=null}try{
 const snap=await getDoc(ref());const data=snap.exists()?snap.data():null;const remote=Array.isArray(data?.records)?data.records:[];
 if(remote.length){
  copyLocal();
  if(records.length&&hash(records)!==hash(remote)){
   const useMerge=confirm('Bulutta '+remote.length+' kayıt, bu cihazda '+records.length+' kayıt var.\n\nTamam: İki cihazın kayıtlarını birleştir (önerilir).\nİptal: Bu cihazdaki kayıtları değiştirme; bulutla eşitleme başlamasın.');
   if(!useMerge){status('Eşitleme duraklatıldı');return}
   records=merge(records,remote);
  }else records=remote;
  // Buluttaki tema ve tercihler diğer cihazla ortak olsun.
  if(data.prefs&&typeof data.prefs==='object')prefs={...prefs,...data.prefs};
 }
 persistLocal();render();ready=true;
 remoteSnapshotHash=hash({records:remote,prefs:data?.prefs||prefs});
 if(!data||hash(records)!==hash(remote))await writeCloud();else status('Bulutla eşitlendi');
 // Aynı hesapla diğer cihazdan gelen değişiklikleri de al.
 unsubscribe=onSnapshot(ref(),snap=>{if(!ready||writing||!snap.exists())return;const d=snap.data(), incoming=Array.isArray(d.records)?d.records:[];
  if(hash(incoming)===hash(records)){remoteSnapshotHash=hash({records:incoming,prefs:d.prefs||prefs});return}
  copyLocal();const merged=merge(records,incoming);const changed=hash(merged)!==hash(records);records=merged;
  if(changed){persistLocal();render()}
  remoteSnapshotHash=hash({records:incoming,prefs:d.prefs||prefs});
  if(hash(merged)!==hash(incoming))scheduleWrite();else status('Bulutla eşitlendi');
 },err=>{console.error(err);status('Bulut bağlantı hatası')});
 }catch(e){console.error(e);status('Bulut bağlantısı kurulamadı');alert('Firebase bağlantısı kurulamadı. Firestore kurallarını ve internet bağlantını kontrol et. Kayıtların bu cihazda duruyor.')} }
login.onclick=async()=>{if(cloudUser){if(!confirm('Google hesabından çıkış yapılsın mı? Bu cihazdaki kayıtlar silinmez.'))return;ready=false;if(unsubscribe)unsubscribe();unsubscribe=null;await signOut(auth);return}
 try{status('Google girişi açılıyor…');await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider)}catch(e){console.error(e);if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,provider)}else{status('Giriş yapılamadı');alert('Google girişi başarısız: '+(e.code||e.message)+'\nTarayıcıda açılır pencere engelini kontrol et.')}}};
onAuthStateChanged(auth,async user=>{if(!user){cloudUser=null;ready=false;if(unsubscribe)unsubscribe();unsubscribe=null;login.textContent='Google ile giriş';status('Bu cihazda kayıtlı');return}login.textContent='Çıkış';await beginSync(user)});
getRedirectResult(auth).catch(e=>console.warn('Yönlendirme girişi:',e));
</script></body></html>
