<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5dce2"><title>Tavşan • Çalışma Defterim</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light;--bg:#fff8f7;--card:#fff;--text:#50373e;--muted:#806b71;--accent:#cb7088;--light:#f9e4e9;--border:#efdce0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:var(--card);border-bottom:1px solid var(--border);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}header strong{font-size:23px}header small{color:var(--muted)}.shell{max-width:1100px;margin:auto;display:grid;grid-template-columns:205px 1fr;gap:22px;padding:20px}nav{display:flex;flex-direction:column;gap:7px}nav button,.ghost{border:0;background:transparent;color:var(--text);padding:12px;border-radius:12px;text-align:left}nav button.active,nav button:hover{background:var(--light)}main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{border:0;background:var(--accent);color:white;border-radius:12px;padding:12px 17px;font-weight:650}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:19px;margin:15px 0;box-shadow:0 2px 12px #00000006}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid .card{margin:0}.muted{color:var(--muted);font-size:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}input,textarea,select{border:1px solid var(--border);border-radius:10px;padding:11px;background:var(--card);color:var(--text);width:100%}textarea{min-height:150px;resize:vertical}label{display:block;font-size:14px;margin:12px 0 5px}h1{font-size:26px;margin:5px 0 10px}h2{font-size:18px;margin:0 0 13px}h3{margin:6px 0}.hide{display:none!important}.tag{background:var(--light);padding:5px 9px;border-radius:20px;font-size:12px}.small{padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}dialog{border:1px solid var(--border);border-radius:18px;max-width:580px;width:calc(100% - 28px);background:var(--bg);color:var(--text);padding:23px}dialog::backdrop{background:#0006}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{color:var(--muted);padding:12px 0}.mobile-nav{display:none}body[data-theme=sade]{--bg:#f7f8fa;--card:#fff;--text:#26323a;--muted:#69737d;--accent:#526e88;--light:#e9eef3;--border:#e1e6ea}body[data-theme=zarif]{--bg:#f9f6ef;--card:#fffefa;--text:#554b3d;--muted:#81796d;--accent:#a28b69;--light:#f0e8d8;--border:#e8e0d3}body[data-theme=gece]{color-scheme:dark;--bg:#191b23;--card:#252833;--text:#f3eaf0;--muted:#b9aeb9;--accent:#ad7799;--light:#37303e;--border:#45414c}@media(max-width:700px){header{padding:11px 15px}.shell{display:block;padding:13px 13px 85px}nav{display:none}.grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);justify-content:space-around;z-index:3}.mobile-nav button{background:none;border:0;padding:12px 5px;color:var(--text);font-size:12px}.top{align-items:flex-start}h1{font-size:23px}.card{padding:15px}}
</style></head><body data-theme="soft"><header><div><strong>🐰 Tavşan</strong><br><small>Çalışma Defterim</small></div><div style="text-align:right"><span id="today" class="muted"></span><br><button id="installApp" type="button" style="display:none;font-size:12px;padding:6px 10px;margin-top:5px">📲 Yükle</button></div></header><div class="shell"><nav id="nav"></nav><main><section id="home"></section><section id="notes" class="hide"></section><section id="tasks" class="hide"></section><section id="calendar" class="hide"></section><section id="reports" class="hide"></section><section id="settings" class="hide"></section></main></div><div class="mobile-nav" id="mobile"></div>
<dialog id="editor"><form id="recordForm"><div class="top"><h2 id="editorTitle">Hızlı Kayıt</h2><button type="button" class="small" onclick="editor.close()">Kapat</button></div><label>Başlık</label><input id="title" placeholder="Örn. Emine Hoca ile toplantı" required><label>Notlar / açıklama</label><textarea id="content" placeholder="Aklına geldiği gibi yaz. Daha sonra düzenleyebilirsin."></textarea><div class="two"><div><label>Tür</label><select id="type"><option value="not">Not</option><option value="gorev">Görev</option><option value="karar">Karar</option><option value="toplanti">Toplantı</option></select></div><div><label>Durum</label><select id="status"><option>Yapılacak</option><option>Devam Ediyor</option><option>Beklemede</option><option>Tamamlandı</option></select></div></div><div class="two"><div><label>Planlanan tarih</label><input id="due" type="date"></div><div><label>Çalışma süresi (dakika)</label><input id="minutes" type="number" min="0" placeholder="İsteğe bağlı"></div></div><label>Görevi veren / ilgili kişi</label><input id="person" placeholder="İsteğe bağlı"><label>Gelişme / sonuç</label><textarea id="result" style="min-height:75px" placeholder="İsteğe bağlı"></textarea><p class="muted">Kayıtlar bu tarayıcıda saklanır. Başka cihazla henüz eşitlenmez.</p><button class="primary" type="submit">Kaydet</button></form></dialog>
<script>
const KEY='tavsan-v1', SETTINGS='tavsan-settings-v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),prefs=JSON.parse(localStorage.getItem(SETTINGS)||'{"theme":"soft","morning":"08:30","weekend":false}'),current='home',editing=null;const $=id=>document.getElementById(id),dateStr=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},today=dateStr(new Date()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),names={home:'Ana Sayfa',notes:'Notlarım',tasks:'Görevlerim',calendar:'Takvimim',reports:'Raporlar',settings:'Ayarlar'},icons={home:'⌂',notes:'▤',tasks:'☑',calendar:'▦',reports:'▥',settings:'⚙'};function save(){localStorage.setItem(KEY,JSON.stringify(records))}function savePrefs(){localStorage.setItem(SETTINGS,JSON.stringify(prefs))}function navigate(id){current=id;Object.keys(names).forEach(k=>$(k).classList.toggle('hide',k!==id));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));render()}function navs(){let html=Object.keys(names).map(k=>`<button data-nav="${k}" onclick="navigate('${k}')">${icons[k]} &nbsp;${names[k]}</button>`).join('');$('nav').innerHTML=html;$('mobile').innerHTML=['home','calendar','notes','tasks','settings'].map(k=>`<button data-nav="${k}" onclick="navigate('${k}')">${icons[k]}<br>${names[k]}</button>`).join('')}function openEditor(id){editing=id??null;let r=records.find(x=>x.id===id)||{};$('editorTitle').textContent=id?'Kaydı Düzenle':'Hızlı Kayıt';['title','content','person','result'].forEach(k=>$(k).value=r[k]||'');$('type').value=r.type||'not';$('status').value=r.status||'Yapılacak';$('due').value=r.due||'';$('minutes').value=r.minutes??'';$('editor').showModal();$('title').focus()}$('recordForm').onsubmit=e=>{e.preventDefault();let r=editing?records.find(x=>x.id===editing):{id:crypto.randomUUID(),created:new Date().toISOString()};['title','content','type','status','due','person','result'].forEach(k=>r[k]=$(k).value);r.minutes=Number($('minutes').value)||0;r.updated=new Date().toISOString();if(r.status==='Tamamlandı'&&!r.completed)r.completed=new Date().toISOString();if(r.status!=='Tamamlandı')r.completed=null;if(!editing)records.unshift(r);save();$('editor').close();render()};function item(r){return `<div class="item"><div class="row"><b>${esc(r.title)}</b><span class="tag">${esc(({not:'Not',gorev:'Görev',karar:'Karar',toplanti:'Toplantı'})[r.type])}</span>${r.type==='gorev'?`<span class="tag">${esc(r.status)}</span>`:''}</div><div class="muted">${r.due?'📅 '+esc(r.due)+' · ':''}${r.person?esc(r.person)+' · ':''}${r.minutes?r.minutes+' dk · ':''}${new Date(r.created).toLocaleDateString('tr-TR')}</div>${r.content?`<p style="white-space:pre-wrap">${esc(r.content.slice(0,260))}${r.content.length>260?'…':''}</p>`:''}<div class="row"><button class="small" onclick="openEditor('${r.id}')">Düzenle</button>${r.type==='not'||r.type==='toplanti'?`<button class="small" onclick="copyTask('${r.id}')">Görev çıkar</button>`:''}<button class="small" onclick="removeRecord('${r.id}')">Sil</button></div></div>`}function copyTask(id){let r=records.find(x=>x.id===id);openEditor();$('title').value=r.title+' — görev';$('content').value='Kaynak not: '+r.title+'\n\n'+r.content;$('type').value='gorev';$('person').value=r.person||''}function removeRecord(id){if(confirm('Bu kayıt silinsin mi?')){records=records.filter(x=>x.id!==id);save();render()}}function box(title,body){return `<div class="card"><h2>${title}</h2>${body||'<div class="empty">Henüz kayıt yok.</div>'}</div>`}function render(){document.body.dataset.theme=prefs.theme;$('today').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});let task=records.filter(r=>r.type==='gorev'),pending=task.filter(r=>r.status!=='Tamamlandı'),todayItems=records.filter(r=>r.due===today),latest=records.slice(0,4);$('home').innerHTML=`<div class="top"><div><h1>Merhaba! 🌷</h1><div class="muted">Bugün neler yapacağız?</div></div><button class="primary" onclick="openEditor()">＋ Hızlı Kayıt</button></div>${box('📅 Bugünkü Planım',todayItems.map(item).join(''))}<div class="grid">${box('☑ Görevlerim',`<p><b>${pending.length}</b> açık görev · <b>${task.filter(r=>r.status==='Beklemede').length}</b> beklemede</p><button class="small" onclick="navigate('tasks')">Görevleri aç →</button>`)}${box('⏱ Çalışma Sürem',`<h3>${records.filter(r=>dateStr(r.created)===today).reduce((n,r)=>n+r.minutes,0)} dakika</h3><span class="muted">Bugün kaydedilen süre</span>`)}</div>${box('📝 Son Notlarım',latest.map(item).join(''))}`;$('notes').innerHTML=`<div class="top"><h1>Not Defterim</h1><button class="primary" onclick="openEditor()">＋ Yeni Not</button></div>${box('Tüm notlar ve toplantılar',records.filter(r=>r.type!=='gorev').map(item).join(''))}`;$('tasks').innerHTML=`<div class="top"><h1>Görevlerim</h1><button class="primary" onclick="openEditor()">＋ Yeni Kayıt</button></div>${box('Yapılacak · Devam Ediyor · Beklemede',pending.map(item).join(''))}${box('Tamamlananlar',task.filter(r=>r.status==='Tamamlandı').map(item).join(''))}`;let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return dateStr(d)});$('calendar').innerHTML=`<h1>Takvimim</h1><p class="muted">Haftalık ajanda · Kendi kayıtların (Google Takvim bağlantısı sonraki aşamada)</p>${dates.map(d=>box(new Date(d+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}),records.filter(r=>r.due===d).map(item).join(''))).join('')}`;let done=task.filter(r=>r.status==='Tamamlandı');$('reports').innerHTML=`<h1>Raporlarım</h1>${box('Genel Özet',`<p>Toplam kayıt: <b>${records.length}</b></p><p>Tamamlanan görev: <b>${done.length}</b></p><p>Bekleyen görev: <b>${task.filter(r=>r.status==='Beklemede').length}</b></p><p>Kaydedilen çalışma süresi: <b>${records.reduce((n,r)=>n+r.minutes,0)} dakika</b></p><button class="small" onclick="exportData()">Verilerimi yedekle (JSON)</button>`)}${box('Bu haftanın kayıtları',records.filter(r=>r.created>=new Date(Date.now()-7*864e5).toISOString()).map(item).join(''))}`;$('settings').innerHTML=`<h1>Ayarlar</h1>${box('🎨 Görünüm',`<label>Tema</label><select id="themeSelect" onchange="prefs.theme=this.value;savePrefs();render()"><option value="soft">Tatlı / Soft</option><option value="sade">Sade Lite</option><option value="zarif">Zarif</option><option value="gece">Gece</option></select><p class="muted">Temalar yalnızca hafif renk değişiklikleri kullanır.</p>`)}${box('🔔 Bildirim tercihleri (taslak)',`<label>Sabah özeti saati</label><input id="morningInput" type="time" value="${esc(prefs.morning)}" onchange="prefs.morning=this.value;savePrefs()"><p><label><input id="weekendInput" type="checkbox" style="width:auto" ${prefs.weekend?'checked':''} onchange="prefs.weekend=this.checked;savePrefs()"> Hafta sonu da özet gönder</label></p><p class="muted">Bu ekran tercihleri saklar; gerçek telefon bildirimleri henüz etkin değildir.</p>`)}${box('💾 Veriler',`<button class="small" onclick="exportData()">Yedek indir</button> <label class="small" style="display:inline-block;cursor:pointer">Yedekten yükle<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><p class="muted">Bu prototipte bilgiler sadece açtığın cihazın tarayıcısındadır. Telefon ve bilgisayar eşitlemesi henüz yoktur.</p>`)}`;$('themeSelect').value=prefs.theme}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({records,prefs},null,2)],{type:'application/json'}));a.download='tavsan-yedek-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.records))throw Error();if(confirm('Mevcut kayıtlar yedektekilerle değiştirilsin mi?')){records=data.records;prefs=data.prefs||prefs;save();savePrefs();render()}}catch{alert('Geçerli bir Tavşan yedeği seç.') }}navs();render();navigate('home');

let deferredInstallPrompt;
window.addEventListener('beforeinstallprompt', event => {event.preventDefault();deferredInstallPrompt=event;document.getElementById('installApp').style.display='inline-block';});
document.getElementById('installApp').addEventListener('click',async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installApp').style.display='none';}else{alert('Chrome menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullan.');}});
window.addEventListener('appinstalled',()=>document.getElementById('installApp').style.display='none');
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}
</script></body></html>
