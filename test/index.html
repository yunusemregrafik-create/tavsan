<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5dce2"><title>Tavşan • Çalışma Defterim</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icon-192.png"><style>

s:9px;background:var(--card);color:var(--text)}dialog{border:1px solid var(--border);border-radius:18px;max-width:580px;width:calc(100% - 28px);background:var(--bg);color:var(--text);padding:23px}dialog::backdrop{background:#0006}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{color:var(--muted);padding:12px 0}.mobile-nav{display:none}body[data-theme=sade]{--bg:#f7f8fa;--card:#fff;--text:#26323a;--muted:#69737d;--accent:#526e88;--light:#e9eef3;--border:#e1e6ea}body[data-theme=zarif]{--bg:#f9f6ef;--card:#fffefa;--text:#554b3d;--muted:#81796d;--accent:#a28b69;--light:#f0e8d8;--border:#e8e0d3}body[data-theme=gece]{color-scheme:dark;--bg:#191b23;--card:#252833;--text:#f3eaf0;--muted:#b9aeb9;--accent:#ad7799;--light:#37303e;--border:#45414c}@media(max-width:700px){header{padding:11px 15px}.shell{display:block;padding:13px 13px 85px}nav{display:none}.grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);justify-content:space-around;z-index:3}.mobile-nav button{background:none;border:0;padding:12px 5px;color:var(--text);font-size:12px}.top{align-items:flex-start}h1{font-size:23px}.card{padding:15px}}

.hero{background:linear-gradient(120deg,#ffe4ef,#fff6dc);border:2px solid #f6bfd0;border-radius:24px;padding:18px;display:flex;align-items:center;gap:15px;margin:12px 0}.hero .mascot{font-size:55px;line-height:1}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini-grid .card{margin:0}.upcoming{border-left:5px solid #69b68b;background:#f1fff5}.overdue{border-left:5px solid #e45b69;background:#fff2f3}.warning-dot{display:inline-block;width:10px;height:10px;background:#e33e54;border-radius:50%;animation:blink 1.8s infinite}@keyframes blink{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){.warning-dot{animation:none}}.metric{font-size:27px;font-weight:800;color:var(--accent)}.meter{height:9px;background:var(--light);border-radius:20px;overflow:hidden}.meter>span{display:block;height:100%;background:var(--accent)}.preview{background:var(--light);padding:12px;border-radius:12px;white-space:pre-wrap}.pill{display:inline-block;border-radius:9px;padding:5px 9px;background:var(--light);margin:4px}

/* Tavşan 2: hızlı, hafif, özgün arayüz */
body[data-theme=soft]{--bg:#fff7f8;--card:#fffdfd;--accent:#cf668e;--light:#ffe8f0;--border:#f4d6e2}
header{background:linear-gradient(110deg,#fff8fb,#fff0f5);box-shadow:0 2px 12px #bd71801a}
header strong{font-family:Georgia,serif;font-size:27px;color:#bb527a}
.card{box-shadow:0 5px 20px #b5677910;border-radius:22px}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#ffe3ef,#fff5e5);min-height:130px}
.hero:after{content:'✿  ✿';position:absolute;right:10px;bottom:8px;color:#e9a3b8;font-size:26px;letter-spacing:13px;opacity:.7}
.hero .mascot{font-size:48px}.hero h1{font-family:Georgia,serif;color:#aa4b73}
.primary{background:linear-gradient(120deg,#d56c97,#c35783);box-shadow:0 3px 8px #bc64823b}
.primary:hover{filter:brightness(.98)}
.item b{line-height:1.4}.item{overflow-wrap:anywhere}
.cloudbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:12px;margin-top:5px}
.cloudbar button{border:1px solid #edc6d3;border-radius:18px;padding:6px 9px;background:white;color:#9b4267;font-weight:650}
#cloudState{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8e6878}
.timerbox{background:var(--light);padding:14px;border-radius:16px;margin:12px 0}
.timerclock{font-size:27px;font-weight:750;font-variant-numeric:tabular-nums}
@media(max-width:700px){header strong{font-size:22px}.cloudbar{justify-content:flex-end}.hero{min-height:110px}.mini-grid .card{padding:12px}.mini-grid h2{font-size:15px}}

/* Tavşan bahçesi */

</style></head><body data-theme="soft"><header><div><strong>🐰 Tavşan</strong><br><small>Çalışma Defterim</small></div><div style="text-align:right"><span id="today" class="muted"></span><div class="cloudbar"><span id="cloudState">Bu cihazda kayıtlı</span><button id="cloudLogin" type="button">Google ile giriş</button></div><button id="installApp" type="button" style="display:none;font-size:12px;padding:6px 10px;margin-top:5px">📲 Yükle</button></div></header><div class="shell"><nav id="nav"></nav><main><section id="home"></section><section id="notes" class="hide"></section><section id="tasks" class="hide"></section><section id="calendar" class="hide"></section><section id="reports" class="hide"></section><section id="settings" class="hide"></section></main></div><div class="mobile-nav" id="mobile"></div>
<dialog id="editor"><form id="recordForm"><div class="top"><h2 id="editorTitle">Hızlı Kayıt</h2><button type="button" class="small" onclick="editor.close()">Kapat</button></div><label>Başlık</label><input id="title" placeholder="Örn. Emine Hoca ile toplantı" required><label>Notlar / açıklama</label><textarea id="content" placeholder="Aklına geldiği gibi yaz. Daha sonra düzenleyebilirsin."></textarea><div class="two"><div><label>Tür</label><select id="type"><option value="not">Not</option><option value="gorev">Görev</option><option value="karar">Karar</option><option value="toplanti">Toplantı</option></select></div><div><label>Durum</label><select id="status"><option>Yapılacak</option><option>Devam Ediyor</option><option>Beklemede</option><option>Tamamlandı</option></select></div></div><div class="two"><div><label>Planlanan tarih</label><input id="due" type="date"></div><div><label>Çalışma süresi (dakika)</label><input id="minutes" type="number" min="0" placeholder="İsteğe bağlı"></div></div><div class="two"><div><label>Öncelik</label><select id="priority"><option>Orta</option><option>Yüksek</option><option>Düşük</option></select></div><div><label>Zorluk</label><select id="difficulty"><option>Orta</option><option>Kolay</option><option>Zor</option></select></div></div><label>Görevi veren / ilgili kişi</label><input id="person" placeholder="İsteğe bağlı"><label>Gelişme / sonuç</label><textarea id="result" style="min-height:75px" placeholder="İsteğe bağlı"></textarea><div class="row"><button type="button" class="small" onclick="organizePreview()">Metni Düzenle · Önizle</button></div><div id="organizeResult" class="hide preview" style="margin-top:10px"></div><p class="muted">Kayıtlar bu cihazda saklanır; Google ile giriş yaptığında bulutla da eşitlenir.</p><button class="primary" type="submit">Kaydet</button></form></dialog>
<script>
const KEY='tavsan-v1', SETTINGS='tavsan-settings-v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),prefs=JSON.parse(localStorage.getItem(SETTINGS)||'{"theme":"soft","morning":"08:30","weekend":false}'),current='home',editing=null;const $=id=>document.getElementById(id),dateStr=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},today=dateStr(new Date()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),names={home:'Ana Sayfa',notes:'Notlarım',tasks:'Görevlerim',calendar:'Takvimim',reports:'Raporlar',settings:'Ayarlar'},icons={home:'🏡',notes:'📖',tasks:'🌷',calendar:'🗓️',reports:'⏳',settings:'⚙️'};function save(){localStorage.setItem(KEY,JSON.stringify(records))}function savePrefs(){localStorage.setItem(SETTINGS,JSON.stringify(prefs))}function navigate(id){current=id;Object.keys(names).forEach(k=>$(k).classList.toggle('hide',k!==id));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));render()}function navs(){let html=Object.keys(names).map(k=>`<button data-nav="${k}" onclick="navigate('${k}')">${icons[k]} &nbsp;${names[k]}</button>`).join('');$('nav').innerHTML=html;$('mobile').innerHTML=['home','calendar','notes','tasks','settings'].map(k=>`<button data-nav="${k}" onclick="navigate('${k}')">${icons[k]}<br>${names[k]}</button>`).join('')}function openEditor(id){editing=id??null;let r=records.find(x=>x.id===id)||{};$('editorTitle').textContent=id?'Kaydı Düzenle':'Hızlı Kayıt';['title','content','person','result'].forEach(k=>$(k).value=r[k]||'');$('type').value=r.type||'not';$('status').value=r.status||'Yapılacak';$('due').value=r.due||'';$('minutes').value=r.minutes??'';$('priority').value=r.priority||'Orta';$('difficulty').value=r.difficulty||'Orta';$('organizeResult').classList.add('hide');$('editor').showModal();$('title').focus()}$('recordForm').onsubmit=e=>{e.preventDefault();let r=editing?records.find(x=>x.id===editing):{id:crypto.randomUUID(),created:new Date().toISOString()};['title','content','type','status','due','person','result'].forEach(k=>r[k]=$(k).value);r.minutes=Number($('minutes').value)||0;r.priority=$('priority').value;r.difficulty=$('difficulty').value;r.updated=new Date().toISOString();if(r.status==='Tamamlandı'&&!r.completed)r.completed=new Date().toISOString();if(r.status!=='Tamamlandı')r.completed=null;if(!editing)records.unshift(r);save();$('editor').close();render()};function item(r){return `<div class="item"><div class="row"><b>${esc(r.title)}</b><span class="tag">${esc(({not:'Not',gorev:'Görev',karar:'Karar',toplanti:'Toplantı'})[r.type])}</span>${r.type==='gorev'?`<span class="tag">${esc(r.status)}</span><span class="tag">${esc(r.priority||'Orta')} öncelik</span>`:''}</div><div class="muted">${r.due?'📅 '+esc(r.due)+' · ':''}${r.person?esc(r.person)+' · ':''}${r.minutes?r.minutes+' dk · ':''}${new Date(r.created).toLocaleDateString('tr-TR')}</div>${r.content?`<p style="white-space:pre-wrap">${esc(r.content.slice(0,260))}${r.content.length>260?'…':''}</p>`:''}<div class="row"><button class="small" onclick="openEditor('${r.id}')">Düzenle</button>${r.type==='not'||r.type==='toplanti'?`<button class="small" onclick="copyTask('${r.id}')">Görev çıkar</button>`:''}<button class="small" onclick="removeRecord('${r.id}')">Sil</button></div></div>`}function copyTask(id){let r=records.find(x=>x.id===id);openEditor();$('title').value=r.title+' — görev';$('content').value='Kaynak not: '+r.title+'\n\n'+r.content;$('type').value='gorev';$('person').value=r.person||''}function removeRecord(id){if(confirm('Bu kayıt silinsin mi?')){records=records.filter(x=>x.id!==id);save();render()}}function box(title,body){return `<div class="card"><h2>${title}</h2>${body||'<div class="empty">Henüz kayıt yok.</div>'}</div>`}function render(){document.body.dataset.theme=prefs.theme;$('today').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});let task=records.filter(r=>r.type==='gorev'),pending=task.filter(r=>r.status!=='Tamamlandı'),todayItems=records.filter(r=>r.due===today),latest=records.slice(0,4);$('home').innerHTML=`<div class="hero"><div class="mascot"><svg viewBox="0 0 120 120" role="img" aria-label="Papatyalı beyaz tavşan"><ellipse cx="43" cy="37" rx="13" ry="34" fill="#fff" stroke="#b9748c" stroke-width="2" transform="rotate(-13 43 37)"/><ellipse cx="79" cy="37" rx="13" ry="34" fill="#fff" stroke="#b9748c" stroke-width="2" transform="rotate(13 79 37)"/><ellipse cx="43" cy="35" rx="6" ry="22" fill="#f8b3cb" transform="rotate(-13 43 35)"/><ellipse cx="79" cy="35" rx="6" ry="22" fill="#f8b3cb" transform="rotate(13 79 35)"/><ellipse cx="61" cy="79" rx="39" ry="34" fill="#fff" stroke="#b9748c" stroke-width="2"/><ellipse cx="43" cy="80" rx="8" ry="6" fill="#fbd6e1"/><ellipse cx="80" cy="80" rx="8" ry="6" fill="#fbd6e1"/><circle cx="48" cy="72" r="3.5" fill="#58424a"/><circle cx="74" cy="72" r="3.5" fill="#58424a"/><path d="M57 84 Q61 89 65 84" fill="none" stroke="#8b5264" stroke-width="2"/><path d="M57 81 Q61 77 65 81 Q61 86 57 81" fill="#d986a2"/><g transform="translate(91 49)"><circle r="8" fill="#f6c454"/><g fill="#fff"><ellipse cy="-13" rx="5" ry="9"/><ellipse cy="13" rx="5" ry="9"/><ellipse cx="-13" rx="9" ry="5"/><ellipse cx="13" rx="9" ry="5"/></g><circle r="5" fill="#f3bb43"/></g></svg></div><div><h1 style="margin:0">Tavşan · Çalışma Defterim</h1><div class="muted">Bismillah! Bugün de hayra vesile olsun. 🌼</div></div></div><div class="top"><h1>🌸 Bugün Yapılacaklar</h1><button class="primary" onclick="openEditor()">＋ Hızlı Kayıt</button></div>${box('Bugünkü Planım 🥕',pending.filter(r=>r.due===today||r.due&&r.due<today).sort((a,b)=>(a.due<today?-1:0)-(b.due<today?-1:0)||rank(a.priority)-rank(b.priority)).map(item).join(''))}<div class="mini-grid"><div class="card upcoming"><h2>Yaklaşanlar 🌱</h2><div class="metric">${pending.filter(r=>r.due>today&&day  const {start,end}=tavsanWeek();const qs='?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(start.toISOString())+'&timeMax='+encodeURIComponent(end.toISOString());
 const results=await Promise.all(calendarLists.filter(c=>calendarSelected.includes(c.id)).map(async c=>{const data=await googleCalendarRequest('calendars/'+encodeURIComponent(c.id)+'/events'+qs);return(data.items||[]).map(e=>{const startValue=e.start?.dateTime||e.start?.date||'';const allDay=!!e.start?.date;return{title:e.summary||'(Başlıksız etkinlik)',calendar:c.summary||c.id,day:allDay?startValue:dateStr(new Date(startValue)),sort:startValue,time:allDay?'Tüm gün':new Date(startValue).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}})}));
 calendarData=results.flat();drawTavsanCalendar();setCalendarStatus('🌷 '+calendarData.length+' etkinlik görüntülendi · Salt okunur');
 }catch(e){console.error(e);setCalendarStatus('Takvim alınamadı: '+e.message)}};
// Bildirim izni ve FCM cihaz kaydı. Zamanlı gönderim için ayrıca güvenli sunucu gerekir.
window.tavsanEnablePush=async()=>{const el=document.getElementById('pushStatus');const statusPush=s=>{if(el)el.textContent=s};try{
 if(!auth.currentUser){statusPush('Önce Google hesabına giriş yap.');return}
 if(!('Notification'in window)||!('serviceWorker'in navigator)){statusPush('Bu tarayıcı web bildirimlerini desteklemiyor.');return}
 if(!await isSupported()){statusPush('Bu cihazda Firebase mesajlaşma desteklenmiyor.');return}
 const permission=await Notification.requestPermission();if(permission!=='granted'){statusPush('Bildirim izni verilmedi. Chrome ayarlarından izin verebilirsin.');return}
 statusPush('Telefon bildirim sistemine kaydediliyor…');
 const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;
 const messaging=getMessaging(app);const token=await getToken(messaging,{vapidKey:pushPublicKey,serviceWorkerRegistration:registration});if(!token)throw Error('Bildirim cihaz anahtarı alınamadı.');
 await setDoc(doc(db,'users',auth.currentUser.uid,'pushTokens',await tokenDeviceId()),{token,updatedAt:serverTimestamp(),platform:navigator.userAgent.slice(0,150),enabled:true},{merge:true});
 statusPush('✅ Telefon bildirimlere kaydedildi! Şimdi “Test bildirimi göster” düğmesini dene. Otomatik hatırlatmalar henüz kurulmadı.');
 }catch(e){console.error('Push:',e);statusPush('Bildirim kaydı başarısız: '+(e.code||e.message)+'. Firestore izinleri veya servis çalışanı kontrol edilmeli.')}};
async function tokenDeviceId(){let id=localStorage.getItem('tavsan-push-device-id');if(!id){id=crypto.randomUUID();localStorage.setItem('tavsan-push-device-id',id)}return id}
</script></body></html>
